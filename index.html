<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hamidi Partners</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:#05060a;color:#e9ecf5;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.logo{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:.02em}
.logo-mark{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:15px;color:#fff;background:linear-gradient(135deg,#ff6a3d,#ff5e7e);box-shadow:0 0 24px -4px rgba(255,106,61,.8)}
</style>
</head>
<body>
<div class="logo" aria-label="Hamidi Partners"><span class="logo-mark">HP</span><span>Hamidi Partners</span></div>
</body>
</html>
